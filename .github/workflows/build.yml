# .github/workflows/build.yml
# -------------------------------------------------------
# Rebuilds meetings/index.html and events/index.html from
# TOML data files whenever _data/** changes, or nightly.
#
# Nightly run advances "today" so past events hide
# automatically without any manual edit.
# -------------------------------------------------------

name: Build site from data

on:
  push:
    paths:
      - "_data/**"        # any TOML edit triggers a rebuild
  schedule:
    - cron: "0 6 * * *"   # 6:00 UTC = midnight Central (adjust for DST)
  workflow_dispatch:       # allow manual trigger from GitHub Actions UI

permissions:
  contents: write           # needed to commit generated HTML back

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Run build script
        run: python _build/build.py

      - name: Commit generated HTML (if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add meetings/index.html events/index.html
          # Only commit if something actually changed
          git diff --cached --quiet || git commit -m "chore: rebuild HTML from data [skip ci]"
          git push